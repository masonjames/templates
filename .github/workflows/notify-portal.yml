name: Notify Client Portal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Generate exact current and previous catalogs
        run: |
          set -euo pipefail
          materialize_catalog() {
            local ref="$1"
            local root="$2"
            local output="$3"
            mkdir -p "$root"
            git archive "$ref" | tar -x -C "$root"
            if [ -f "$root/build-scripts/generate-meta.js" ]; then
              node "$root/build-scripts/generate-meta.js" --output "$output"
            elif [ -f "$root/meta.json" ]; then
              cp "$root/meta.json" "$output"
            else
              echo "${ref} has no supported catalog source" >&2
              exit 1
            fi
          }

          materialize_catalog HEAD /tmp/templates-current /tmp/current-meta.json
          materialize_catalog HEAD^ /tmp/templates-previous /tmp/previous-meta.json

      - name: Bind dispatch payload to exact source content
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def read_json(path):
              return json.loads(Path(path).read_text())

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          previous = {item["id"]: item.get("version", "unknown") for item in read_json("/tmp/previous-meta.json")}
          current_entries = read_json("/tmp/current-meta.json")
          current = {item["id"]: item.get("version", "unknown") for item in current_entries}
          changed = sorted(
              f"{item_id}:{previous[item_id]}->{current[item_id]}"
              for item_id in previous.keys() & current.keys()
              if previous[item_id] != current[item_id]
          )
          added = sorted(current.keys() - previous.keys())
          removed = sorted(previous.keys() - current.keys())
          source_repo = os.environ["SOURCE_REPO"]
          source_sha = os.environ["SOURCE_SHA"]
          payload = {
              "event_type": "template-catalog-updated",
              "client_payload": {
                  "changed": changed,
                  "added": added,
                  "removed": removed,
                  "source_repo": source_repo,
                  "source_sha": source_sha,
                  "catalog_sha256": digest("/tmp/current-meta.json"),
                  "override_manifest_sha256": digest("overrides/manifest.json"),
                  "curated_top25_sha256": digest("curated/top-25.json"),
                  "test_registry_sha256": digest("curated/test-registry.json"),
                  "blueprint_count": len(current_entries),
                  "commit_url": f"https://github.com/{source_repo}/commit/{source_sha}",
              },
          }
          Path("/tmp/client-portal-dispatch.json").write_text(json.dumps(payload, separators=(",", ":")))
          Path("/tmp/client-portal-dispatch-summary.json").write_text(
              json.dumps(payload["client_payload"], indent=2) + "\n"
          )
          PY

      - name: Dispatch exact catalog receipt to Client Portal
        env:
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PORTAL_DISPATCH_TOKEN" ]; then
            echo "PORTAL_DISPATCH_TOKEN is required" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PORTAL_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/client-portal-dispatch.json \
            --max-time 30 \
            --retry 2 \
            https://api.github.com/repos/masonjames/client-portal/dispatches

      - name: Record non-secret dispatch summary
        if: always()
        run: |
          if [ -f /tmp/client-portal-dispatch-summary.json ]; then
            {
              echo "## Client Portal catalog dispatch"
              echo '```json'
              cat /tmp/client-portal-dispatch-summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
