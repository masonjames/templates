name: Dagger Upstream Sync

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Materialize the attended one-time rebaseline without publishing it
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: templates-upstream-sync
  cancel-in-progress: false

jobs:
  validate:
    name: Audit and validate exact upstream candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      status: ${{ steps.classify.outputs.status }}
      fork_sha: ${{ steps.refs.outputs.fork_sha }}
      upstream_sha: ${{ steps.refs.outputs.upstream_sha }}
    steps:
      - name: Checkout exact fork main without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact refs and create a credential-free Git bundle
        id: refs
        run: |
          set -euo pipefail
          git fetch --no-tags --force \
            https://github.com/Dokploy/templates.git \
            refs/heads/canary:refs/remotes/upstream/canary
          FORK_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse refs/remotes/upstream/canary)
          if [[ ! "$FORK_SHA" =~ ^[0-9a-f]{40}$ || ! "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact fork and upstream SHAs are required" >&2
            exit 1
          fi
          git bundle create /tmp/templates-sync.bundle HEAD refs/remotes/upstream/canary
          git bundle verify /tmp/templates-sync.bundle
          echo "fork_sha=$FORK_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve attended bootstrap flags
        id: flags
        env:
          REQUESTED_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap || false }}
        run: |
          if [ "$REQUESTED_BOOTSTRAP" = "true" ]; then
            echo "audit=--bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "materialize=--bootstrap=true --allow-needs-review=true" >> "$GITHUB_OUTPUT"
          else
            echo "audit=" >> "$GITHUB_OUTPUT"
            echo "materialize=" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit exact refs through Dagger
        id: audit
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "0.21.8"
          call: >-
            audit
            --source=.
            --bundle=/tmp/templates-sync.bundle
            --fork-sha=${{ steps.refs.outputs.fork_sha }}
            --upstream-sha=${{ steps.refs.outputs.upstream_sha }}
            ${{ steps.flags.outputs.audit }}

      - name: Classify audit without publishing
        id: classify
        env:
          AUDIT_RECEIPT: ${{ steps.audit.outputs.stdout }}
        run: |
          printf '%s\n' "$AUDIT_RECEIPT" > /tmp/receipt.json
          STATUS=$(jq -r .status /tmp/receipt.json)
          case "$STATUS" in
            noop|ready|needs_review|failed) ;;
            *) echo "Dagger audit returned unknown status ${STATUS}" >&2; exit 1 ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          jq . /tmp/receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Validate materialized candidate through Dagger
        id: check
        if: steps.classify.outputs.status == 'ready' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap)
        continue-on-error: true
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "0.21.8"
          call: >-
            check
            --source=.
            --bundle=/tmp/templates-sync.bundle
            --fork-sha=${{ steps.refs.outputs.fork_sha }}
            --upstream-sha=${{ steps.refs.outputs.upstream_sha }}
            ${{ steps.flags.outputs.materialize }}

      - name: Bind validated receipt
        if: steps.check.outcome == 'success'
        env:
          CHECK_RECEIPT: ${{ steps.check.outputs.stdout }}
        run: printf '%s\n' "$CHECK_RECEIPT" > /tmp/receipt.json

      - name: Export deterministic candidate
        if: steps.check.outcome == 'success'
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "0.21.8"
          call: >-
            materialize
            --source=.
            --bundle=/tmp/templates-sync.bundle
            --fork-sha=${{ steps.refs.outputs.fork_sha }}
            --upstream-sha=${{ steps.refs.outputs.upstream_sha }}
            ${{ steps.flags.outputs.materialize }}
            export --path=/tmp/candidate

      - name: Package immutable evidence artifact
        if: always() && steps.classify.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p /tmp/templates-sync-artifact
          cp /tmp/receipt.json /tmp/templates-sync-artifact/receipt.json
          if [ -d /tmp/candidate ]; then
            tar \
              --sort=name \
              --mtime='UTC 1970-01-01' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -cf /tmp/templates-sync-artifact/candidate.tar \
              -C /tmp/candidate .
          fi
          tar -cf /tmp/templates-sync-artifact.tar -C /tmp/templates-sync-artifact .

      - name: Upload receipt and optional candidate
        if: always() && steps.classify.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: templates-sync-${{ github.run_id }}
          path: /tmp/templates-sync-artifact.tar
          if-no-files-found: error
          retention-days: 30

      - name: Stop on non-publishable or failed validation
        if: always() && steps.classify.outcome == 'success'
        env:
          STATUS: ${{ steps.classify.outputs.status }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          ATTENDED_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap || false }}
        run: |
          if [ "$CHECK_OUTCOME" = "failure" ]; then
            echo "Dagger candidate validation failed; inspect the retained run logs and receipt." >&2
            exit 1
          fi
          if [ "$STATUS" = "failed" ]; then
            echo "The upstream audit failed closed; no publisher was entered." >&2
            exit 1
          fi
          if [ "$STATUS" = "needs_review" ] && [ "$ATTENDED_BOOTSTRAP" != "true" ]; then
            echo "The upstream audit requires attended review; no publisher was entered." >&2
            exit 1
          fi

  publish-draft:
    name: Publish one signed draft pull request
    needs: validate
    if: needs.validate.outputs.status == 'ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Mint repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TEMPLATES_SYNC_APP_ID }}
          private-key: ${{ secrets.TEMPLATES_SYNC_APP_PRIVATE_KEY }}
          owner: masonjames
          repositories: templates
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout exact fork parent without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.fork_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable candidate artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: templates-sync-${{ github.run_id }}
          path: /tmp/templates-sync-download

      - name: Verify, sign, and publish exact candidate branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FORK_SHA: ${{ needs.validate.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ needs.validate.outputs.upstream_sha }}
          BOT_NAME: ${{ vars.TEMPLATES_SYNC_BOT_NAME }}
          BOT_EMAIL: ${{ vars.TEMPLATES_SYNC_BOT_EMAIL }}
          SSH_SIGNING_KEY: ${{ secrets.TEMPLATES_SYNC_SSH_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for required in GH_TOKEN FORK_SHA UPSTREAM_SHA BOT_NAME BOT_EMAIL SSH_SIGNING_KEY; do
            if [ -z "${!required}" ]; then
              echo "Required publisher input ${required} is missing" >&2
              exit 1
            fi
          done
          tar -xf /tmp/templates-sync-download/templates-sync-artifact.tar -C /tmp
          mkdir -p /tmp/candidate
          tar -xf /tmp/candidate.tar -C /tmp/candidate
          if [ "$(jq -r .status /tmp/receipt.json)" != "ready" ]; then
            echo "Only a ready receipt may enter the publisher" >&2
            exit 1
          fi
          if [ "$(jq -r .fork_sha /tmp/receipt.json)" != "$FORK_SHA" ] \
            || [ "$(jq -r .upstream_sha /tmp/receipt.json)" != "$UPSTREAM_SHA" ]; then
            echo "Receipt ref binding mismatch" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$FORK_SHA" ]; then
            echo "Publisher checkout does not match the validated fork parent" >&2
            exit 1
          fi
          CANDIDATE_DIGEST=$(python3 .fork-sync/sync_engine.py digest --root /tmp/candidate)
          if [ "$CANDIDATE_DIGEST" != "$(jq -r .candidate_digest /tmp/receipt.json)" ]; then
            echo "Candidate digest mismatch" >&2
            exit 1
          fi

          git fetch --no-tags https://github.com/Dokploy/templates.git "$UPSTREAM_SHA"
          git cat-file -e "${UPSTREAM_SHA}^{commit}"
          export GIT_INDEX_FILE=/tmp/templates-sync.index
          git read-tree --empty
          git --work-tree=/tmp/candidate add --all --force .
          TREE_SHA=$(git write-tree)

          mkdir -p /tmp/templates-sync-signing
          printf '%s' "$SSH_SIGNING_KEY" > /tmp/templates-sync-signing/private-key
          chmod 600 /tmp/templates-sync-signing/private-key
          ssh-keygen -y -f /tmp/templates-sync-signing/private-key \
            > /tmp/templates-sync-signing/public-key
          printf '%s %s\n' "$BOT_EMAIL" "$(cat /tmp/templates-sync-signing/public-key)" \
            > /tmp/templates-sync-signing/allowed-signers
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git config gpg.format ssh
          git config user.signingkey /tmp/templates-sync-signing/private-key
          git config gpg.ssh.allowedSignersFile /tmp/templates-sync-signing/allowed-signers
          GIT_AUTHOR_DATE=$(git show -s --format=%cI "$UPSTREAM_SHA")
          export GIT_AUTHOR_DATE
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          COMMIT_SHA=$(printf 'chore: sync Dokploy templates canary\n\nUpstream: %s\n' "$UPSTREAM_SHA" \
            | git commit-tree -S "$TREE_SHA" -p "$FORK_SHA" -p "$UPSTREAM_SHA")
          git verify-commit "$COMMIT_SHA"
          if [ "$(git show -s --format=%P "$COMMIT_SHA")" != "$FORK_SHA $UPSTREAM_SHA" ]; then
            echo "Signed candidate parents are incorrect" >&2
            exit 1
          fi

          BRANCH=upstream-sync/dokploy-canary
          REMOTE_SHA=$(git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${BRANCH}" | awk '{print $1}')
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${COMMIT_SHA}:refs/heads/${BRANCH}" \
            --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}"

          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("/tmp/receipt.json").read_text())
          body = f"""## Governed upstream sync

          This draft was materialized from exact refs by the credential-free Dagger contract.

          | Evidence | Value |
          |---|---|
          | Fork parent | `{receipt['fork_sha']}` |
          | Upstream parent | `{receipt['upstream_sha']}` |
          | Incoming commits | {receipt['incoming_commit_count']} |
          | Changed files | {receipt['incoming_file_count']} |
          | Candidate digest | `{receipt['candidate_digest']}` |
          | Generated templates | {receipt['generated_catalog_count']} |

          Owned-path collisions: {len(receipt['owned_path_collisions'])}. Validations: {', '.join(receipt['validations'])}.

          This pull request cannot merge or deploy automatically.
          """
          Path("/tmp/pr-body.md").write_text(body)
          PY
          gh label create upstream-sync \
            --color 1D76DB \
            --description "Credential-free Dagger upstream synchronization" \
            --force
          EXISTING=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" \
              --title "Sync Dokploy templates canary" \
              --body-file /tmp/pr-body.md \
              --add-label upstream-sync
            if [ "$(gh pr view "$EXISTING" --json isDraft --jq .isDraft)" != "true" ]; then
              gh pr ready "$EXISTING" --undo
            fi
          else
            gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "Sync Dokploy templates canary" \
              --body-file /tmp/pr-body.md \
              --label upstream-sync
          fi
