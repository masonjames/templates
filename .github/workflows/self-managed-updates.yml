name: Self-Managed Updates

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-managed-template-updates
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1

      - name: Propose reviewed per-blueprint updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f .github/self-managed-watchlist.yml ]; then
            echo "Watchlist not found" >&2
            exit 1
          fi

          WATCHLIST_JSON=$(ruby -rjson -ryaml -e \
            'puts JSON.generate(YAML.safe_load(File.read(ARGV[0]), aliases: false))' \
            .github/self-managed-watchlist.yml)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while IFS= read -r item; do
            ID=$(jq -r .id <<< "$item")
            REPO=$(jq -r .github_repo <<< "$item")
            TAG_PREFIX=$(jq -r .tag_prefix <<< "$item")
            IMAGE=$(jq -r .image <<< "$item")
            META="blueprints/${ID}/meta.json"
            COMPOSE="blueprints/${ID}/docker-compose.yml"
            if [ ! -f "$META" ]; then
              echo "Skipping ${ID}: ${META} is missing"
              continue
            fi

            CURRENT=$(python3 - "$META" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["version"])
          PY
            )
            LATEST_TAG=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG=$(gh api "repos/${REPO}/tags?per_page=1" --jq '.[0].name' 2>/dev/null || true)
            fi
            if [ -z "$LATEST_TAG" ]; then
              echo "Skipping ${ID}: no release or tag was resolved"
              continue
            fi
            LATEST_VERSION="${LATEST_TAG#"$TAG_PREFIX"}"
            if [ "$CURRENT" = "$LATEST_VERSION" ] || [ "$CURRENT" = "latest" ]; then
              echo "${ID} is current (${CURRENT})"
              continue
            fi

            SAFE_VERSION=$(tr -cd 'A-Za-z0-9._-' <<< "$LATEST_VERSION")
            if [ -z "$SAFE_VERSION" ]; then
              echo "Skipping ${ID}: version cannot form a safe branch name" >&2
              continue
            fi
            BRANCH="self-managed/${ID}-${SAFE_VERSION}"
            if gh pr list --head "$BRANCH" --state open --json number --jq 'length > 0' | grep -qx true; then
              echo "Open pull request already exists for ${BRANCH}"
              continue
            fi

            git switch -C "$BRANCH" main
            python3 - "$META" "$LATEST_VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1:]
          data = json.load(open(path))
          data["version"] = version
          with open(path, "w") as stream:
              json.dump(data, stream, indent=2)
              stream.write("\n")
          PY

            if [ -f "$COMPOSE" ] && [ -n "$IMAGE" ]; then
              python3 - "$COMPOSE" "$IMAGE" "$LATEST_VERSION" <<'PY'
          import re, sys
          path, image, version = sys.argv[1:]
          text = open(path).read()
          pattern = re.compile(rf"^(\s*image:\s*){re.escape(image)}:[^\s]+\s*$", re.MULTILINE)
          updated, count = pattern.subn(rf"\g<1>{image}:{version}", text)
          if count:
              open(path, "w").write(updated)
          PY
            fi

            python3 - overrides/manifest.json "$ID" <<'PY'
          import json, sys
          path, template_id = sys.argv[1:]
          data = json.load(open(path))
          entries = data.setdefault("locally_modified", [])
          if not any(entry.get("id") == template_id for entry in entries):
              entries.append({
                  "id": template_id,
                  "reason": f"Self-managed update proposed from the reviewed watchlist for {template_id}",
              })
          entries.sort(key=lambda entry: entry["id"])
          with open(path, "w") as stream:
              json.dump(data, stream, indent=2)
              stream.write("\n")
          PY

            git add "$META" overrides/manifest.json
            if [ -f "$COMPOSE" ]; then
              git add "$COMPOSE"
            fi
            if git diff --cached --quiet; then
              echo "No material change for ${ID}"
              git switch main
              continue
            fi
            git commit -m "chore(${ID}): propose ${LATEST_VERSION}"
            git push --force-with-lease origin "$BRANCH"
            gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "Update ${ID} to ${LATEST_VERSION}" \
              --body "Updates per-blueprint metadata and any exact image tag. The override manifest is activated so Client Portal resolves Compose and TOML from the same fork revision. No automatic merge or deployment is authorized."
            git switch main
          done < <(jq -c '.templates[]' <<< "$WATCHLIST_JSON")
